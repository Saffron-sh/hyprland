# Start essential services once at launch
exec-once = waybar &
exec-once = hyprpaper &
exec-once = hyprsunset &
exec-once = hypridle &
exec-once = dunst &  
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kitty -o allow_remote_control=yes -o enabled_layouts=tall
exec-once = ~/.scripts/python/random_theme.py

# Launch terminal
bind = SUPER, Return, exec, kitty -o allow_remote_control=yes -o enabled_layouts=tall
#Launch Nebula
#bind = SUPER, N, exec, kitty -o allow_remote_control=yes -o enabled_layouts=tall -e bash -c 'source /home/usernorm/misc/forneb/nebula/bin/activate;cd /home/usernorm/misc/forneb/nebula/neb/neb_things/;python -m core_neb'

# Kill focused window
bind = SUPER, Q, killactive

# Reload config
bind = SUPER, R, exec, hyprctl reload

# Exit Hyprland

#(logout)
bind = SUPER SHIFT, E, exit

#(lock)
bind = SUPER SHIFT, L, exec, hyprlock

# Move focus between windows
bind = SUPER, j, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, i, movefocus, u
bind = SUPER, k, movefocus, d

#To move to left and right workspaces
bind = SUPER, left, workspace, -1
bind = SUPER, right, workspace, +1

#To move windows to left and right workspaces
bind = SUPER SHIFT, left, movetoworkspace, -1
bind = SUPER SHIFT, right, movetoworkspace, +1

#To switch windows between workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7

# Run apps:
bind = SUPER, F, exec, hyprland-run

#Theme switching:
#Random:
bind = SUPER SHIFT, S, exec, ~/.scripts/python/random_theme.py

#Sequenced:
bind = SUPER CTRL, 0, exec, ~/.scripts/bash/theme_switch.sh bright
bind = SUPER CTRL, 1, exec, ~/.scripts/bash/theme_switch.sh kath
bind = SUPER CTRL, 2, exec, ~/.scripts/bash/theme_switch.sh forest
bind = SUPER CTRL, 3, exec, ~/.scripts/bash/theme_switch.sh red
bind = SUPER CTRL, 4, exec, ~/.scripts/bash/theme_switch.sh avalon
bind = SUPER CTRL, 5, exec, ~/.scripts/bash/theme_switch.sh steel-scale
bind = SUPER CTRL, 6, exec, ~/.scripts/bash/theme_switch.sh dragon
bind = SUPER CTRL, 7, exec, ~/.scripts/bash/theme_switch.sh tux
bind = SUPER CTRL, 8, exec, ~/.scripts/bash/theme_switch.sh mauser
bind = SUPER CTRL, 9, exec, ~/.scripts/bash/theme_switch.sh avenger
bind = SUPER CTRL, minus, exec, ~/.scripts/bash/theme_switch.sh space
bind = SUPER CTRL, equal, exec, ~/.scripts/bash/theme_switch.sh leviathan

#Adjusting volume and brightness of the screen
binde =, xf86audioraisevolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ 
binde =, xf86audiolowervolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind =, xf86audiomute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = SUPER SHIFT, R, exec, hyprctl hyprsunset gamma 100 
bind = SUPER SHIFT, K, exec, hyprctl hyprsunset gamma 10

binde =, XF86MonBrightnessUp, exec, brightnessctl set +10%
binde =, XF86MonBrightnessDown, exec, brightnessctl set 10%-


#For screenshots
bind =, Print, exec, grim "$HOME/Pictures/screenshots/$(date | tr ' ' '_').png" 

#For animations:
animation = workspaces, 1, 8, default, slide
animation = windows, 1, 8, default, popin
animation = border, 1, 34, default

#For automatic monitor detection and scaling
monitor=eDP-1,preferred,0x0,1
#monitor=HDMI-A-1,preferred,auto,1,mirror,eDP-1 #mirror screen

#Setting up keyboard and mouse (basically input)
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
	disable_while_typing = true
	tap-to-click = yes
	middle_button_emulation = yes
    }
}

#Setting up how things look and how they look good.
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(2685bdcc)
    col.inactive_border = rgba(444444aa)
    layout = dwindle
} 

#Gestures

gesture = 3, horizontal, workspace
gesture = 3, pinchin, fullscreen
gesture = 3, pinchout, close
 
decoration {
    rounding = 7
    
    blur {
	enabled = yes
	size=7
	passes=2
    }
    
    active_opacity=0.93
    inactive_opacity=0.80
}

