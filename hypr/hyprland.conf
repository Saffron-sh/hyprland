bind=SUPER CTRL,T,exec,terminator
bind=SUPER,V, exec,kate
bind=SUPER,W,exec,signal-desktop

#For terminal functions

bind=SHIFT, SPACE, exec, kitten quick-access-terminal
bind=SHIFT, B, exec, kitty -e bash -c 'bashtop'

#For function keys

