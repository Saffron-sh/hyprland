general {
	hide_cursor = false
	grace = 0
}

background {
	monitor = eDP-1
	path = ~/Pictures/misc_pictures/forlock.png
	blur_passes = 0
	blur_size = 0
}

background {
	monitor = HDMI-A-1 
	path = ~/Pictures/misc_pictures/forlock_hdmi.png
    fit_mode = contain
	blur_passes = 0
	blur_size = 0
}

label {
	monitor = eDP-1
	text = cmd[update:1000] echo "<span>$(date +'%H:%M:%S')</span>"
	#text = cmd[update:1000] echo "<span>$(echo bandar )</span>"
	color = rgba(208,44,51,0.8)
	position = 0,120
	font_size = 35
	font_family = Jersey15
}
label {
	monitor = eDP-1
	text = cmd[] echo "<span>$(uname -n)</span>"
    color = rgba(208,44,51,0.8)
	position = 600,-350
	font_size = 35
	font_family = Jersey15
}
input-field {
	monitor = eDP-1
	size = 250,50
	#outer_color = rgba(208,44,51,1)
	#inner_color = rgba(255,255,255,0.15)
	outer_color = rgba(0,0,0,1)
    inner_color = rgba(0,0,0,1)
    font_color = rgba(73, 92, 105,1)
	position = 0,0
	placeholder_text = >_
	capslock_color = rgba(116, 29, 171,1)
	outline_thickness = 2
	dots_size = 0.2
	dots_text_format = *
	rounding = 20
	fade_on_empty = true
	fail_text = Forgot?
	fail_color = rgba(176, 4, 44,0.92)
	check_color = rgba(119, 4, 148,1)
	hide_input = false
    hide_input_base_color = rgba(208,44,51,1)
}

splash=false
